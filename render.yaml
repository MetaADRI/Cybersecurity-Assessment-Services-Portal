services:
  - type: web
    name: odcmp-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: REPORTS_DIR
        value: ./reports/generated
      - key: TZ_DISPLAY
        value: Africa/Lusaka
      - key: LOG_LEVEL
        value: info
      - key: FREE_CHECKS_UNLIMITED
        value: 'false'
      - key: FREE_CHECKS_PER_VISITOR_PER_DAY
        value: '5'
      - key: FREE_CHECKS_PER_IP_PER_DAY
        value: '20'
      - key: FREE_CHECKS_PER_TARGET_PER_HOUR
        value: '3'
      - key: CLIENT_FREE_CHECKS_PER_DAY
        value: '20'
