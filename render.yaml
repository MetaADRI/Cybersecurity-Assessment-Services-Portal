services:
  - type: web
    name: odcmp-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: REPORTS_DIR
        value: ./reports/generated
      - key: TZ_DISPLAY
        value: Africa/Lusaka
      - key: LOG_LEVEL
        value: info
